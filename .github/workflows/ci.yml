name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (stable, k8s ${{ matrix.k8s }}, ${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.32", "1.36"]
        features: ["", validation]
    env:
      K8S_OPENAPI_ENABLED_VERSION: ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.k8s }}-${{ matrix.features }}

      - name: run tests
        run: cargo test --verbose --features "${{ matrix.features }}"

  test-full:
    name: test (${{ matrix.rust }}, k8s ${{ matrix.k8s }}, ${{ matrix.features || 'default' }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        k8s: ["1.33", "1.34", "1.35"]
        features: ["", validation]
        include:
          - rust: nightly
            k8s: "1.36"
            features: ""
          - rust: nightly
            k8s: "1.36"
            features: validation
    env:
      K8S_OPENAPI_ENABLED_VERSION: ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}-${{ matrix.k8s }}-${{ matrix.features }}

      - name: run tests
        run: cargo test --verbose --features "${{ matrix.features }}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: run clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: install tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: generate coverage (with validation)
        run: cargo tarpaulin --verbose --features validation --timeout 120 --out xml

      - name: upload coverage to codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./cobertura.xml
          fail_ci_if_error: false

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: run cargo audit
        run: cargo audit

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check documentation (default features)
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
