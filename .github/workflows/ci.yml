name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (stable, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [v1_31, v1_35, "v1_31,validation", "v1_35,validation"]
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: run tests
        run: cargo test --verbose --no-default-features --features ${{ matrix.features }}

  test-full:
    name: test (${{ matrix.rust }}, ${{ matrix.features }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            features: v1_32
          - rust: stable
            features: v1_33
          - rust: stable
            features: v1_34
          - rust: stable
            features: v1_32,validation
          - rust: stable
            features: v1_33,validation
          - rust: stable
            features: v1_34,validation
          - rust: nightly
            features: v1_35
          - rust: nightly
            features: v1_35,validation
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: run tests
        run: cargo test --verbose --no-default-features --features ${{ matrix.features }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt -- --check

      - name: run clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: install tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: generate coverage (with validation)
        run: cargo tarpaulin --verbose --no-default-features --features v1_35,validation --workspace --timeout 120 --out xml

      - name: upload coverage to codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./cobertura.xml
          fail_ci_if_error: false

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: run cargo audit
        run: cargo audit

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check documentation (default features)
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
