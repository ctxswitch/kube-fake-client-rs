[package]
name = "kube-fake-client"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
authors = ["Rob Lyon <rob@ctxswitch.com>"]
description = "An implimentation of controller-runtime's fake client for rust"
license = "Apache-2.0"
repository = "https://github.com/ctxswitch/kube-fake-client-rs"
include = ["/src", "/examples", "/fixtures", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
features = ["validation", "k8s-openapi/latest"]

[workspace]
members = ["xtask"]

[lib]
name = "kube_fake_client"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "controller"
path = "examples/controller.rs"

[[example]]
name = "custom_resource"
path = "examples/custom_resource.rs"

[[example]]
name = "fixture_loading"
path = "examples/fixture_loading.rs"

[[example]]
name = "status_controller"
path = "examples/status_controller.rs"

[[example]]
name = "interceptors"
path = "examples/interceptors.rs"

[[example]]
name = "schema_validations"
path = "examples/schema_validations.rs"
required-features = ["validation"]

[dependencies]
kube = { version = "4.2", features = ["client", "derive", "jsonpatch"] }
# No version feature: the final crate selects the Kubernetes version.
k8s-openapi = { version = "0.28", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.29"
schemars = "1.0"
thiserror = "2.0"
json-patch = "4.0"
tracing = "0.1"
uuid = { version = "1.19", features = ["v4"] }
jiff = "0.2"
tower = "0.5"
http = "1.4"
http-body-util = "0.1"
bytes = "1.11"
futures = "0.3"
urlencoding = "2.1"
jsonschema = "0.58"

[features]
validation = []  # Enable OpenAPI schema validation with automatic lazy loading

[dev-dependencies]
tokio = { version = "1.49", features = ["full"] }
